; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./

[env]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<*.h> +<common.cpp> +<${PIOENV}/main.cpp>

[env:day1]
[env:day2]
[env:day3]
[env:day4]
[env:day5]
[env:day6]
[env:day7]
[env:r4-led]
platform = renesas-ra
board = uno_r4_wifi
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
build_flags = -std=gnu++23
build_unflags = -std=gnu++17
platform_packages =
    toolchain-gccarmnoneeabi@<1.140000

[env:wi-fi]
platform = renesas-ra
board = uno_r4_wifi
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
build_flags = -std=gnu++23
build_unflags = -std=gnu++17
platform_packages =
    toolchain-gccarmnoneeabi@<1.140000
extra_scripts = pre:wi-fi/env_to_build_flags.py, pre:wi-fi/workaround_byte.py

[env:am2301b-sensor-app]
platform = renesas-ra
board = uno_r4_wifi
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
build_flags = -std=gnu++23
build_unflags = -std=gnu++17
platform_packages =
    toolchain-gccarmnoneeabi@<1.140000
build_src_filter = +<*.h> +<common.cpp> +<${PIOENV}/firmware/main.cpp>
lib_deps =
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.14